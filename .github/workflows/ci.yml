name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [stable]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
      - name: test (with race detector)
        run: go test -race -timeout 240s ./...
      - name: gofmt
        run: |
          out=$(gofmt -l . | tee /dev/stderr)
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files (see above)" >&2
            exit 1
          fi
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # go.mod's module path must match the repo it is served from (#19);
      # github.repository is authoritative in CI, the script falls back to
      # the origin remote locally.
      - name: module path matches remote
        run: scripts/check-module-path.sh "${{ github.repository }}"
      # excision-checklist step 12: the denylist lives as a tripwire so the
      # next excision cannot regress.
      - name: denylist tripwire
        run: scripts/check-denylist.sh
