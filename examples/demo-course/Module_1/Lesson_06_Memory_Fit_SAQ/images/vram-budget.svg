<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" fill="#1a1a2e">Memory budget: 13B at 4-bit on a 24 GB card</text>

  <!-- scale: 24 GB across 640 px starting at x=40, so 1 GB = 26.67 px -->
  <!-- OS/desktop 1.5 GB = 40 px; weights 7.5 GB = 200 px; KV 2 GB = 53 px; buffers 0.5 GB = 13 px; headroom 12.5 GB = 334 px -->
  <g>
    <rect x="40" y="90" width="40" height="60" fill="#e5e7eb" stroke="#4b5563" stroke-width="2"/>
    <rect x="80" y="90" width="200" height="60" fill="#bfdbfe" stroke="#1e40af" stroke-width="2"/>
    <rect x="280" y="90" width="53" height="60" fill="#bbf7d0" stroke="#166534" stroke-width="2"/>
    <rect x="333" y="90" width="14" height="60" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <rect x="347" y="90" width="333" height="60" fill="#f5f5f4" stroke="#78716c" stroke-width="2" stroke-dasharray="6 4"/>
  </g>

  <g font-size="13" fill="#374151">
    <text x="60" y="180" text-anchor="middle">OS +</text>
    <text x="60" y="196" text-anchor="middle">desktop</text>
    <text x="60" y="212" text-anchor="middle">1.5 GB</text>

    <text x="180" y="180" text-anchor="middle" font-weight="bold">weights</text>
    <text x="180" y="196" text-anchor="middle">13B at 4-bit</text>
    <text x="180" y="212" text-anchor="middle">7.5 GB</text>

    <text x="306" y="180" text-anchor="middle" font-weight="bold">KV</text>
    <text x="306" y="196" text-anchor="middle">8k ctx</text>
    <text x="306" y="212" text-anchor="middle">2 GB</text>

    <text x="340" y="240" text-anchor="middle" font-size="12">buffers 0.5 GB</text>

    <text x="513" y="125" text-anchor="middle" font-weight="bold" fill="#57534e">headroom</text>
    <text x="513" y="180" text-anchor="middle">unallocated: fragmentation, driver reserves,</text>
    <text x="513" y="196" text-anchor="middle">context growth — plan for 10–15% free</text>
    <text x="513" y="212" text-anchor="middle">12.5 GB</text>
  </g>

  <g font-size="12" fill="#6b7280">
    <text x="40" y="80">0</text>
    <text x="670" y="80" text-anchor="end">24 GB</text>
  </g>
</svg>
