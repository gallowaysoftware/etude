<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="440" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" fill="#1a1a2e">KV cache: one key and one value vector per token, per layer</text>

  <text x="150" y="70" text-anchor="middle" font-size="14" fill="#374151">context tokens</text>
  <g font-size="13" fill="#374151">
    <text x="240" y="70" text-anchor="middle">token 1</text>
    <text x="330" y="70" text-anchor="middle">token 2</text>
    <text x="420" y="70" text-anchor="middle">token 3</text>
    <text x="510" y="70" text-anchor="middle">…</text>
    <text x="610" y="70" text-anchor="middle">token N</text>
  </g>

  <g font-size="13" fill="#374151" text-anchor="end">
    <text x="160" y="112">layer 1</text>
    <text x="160" y="172">layer 2</text>
    <text x="160" y="232">…</text>
    <text x="160" y="292">layer L</text>
  </g>

  <g>
    <!-- layer rows: each cell holds K (blue) and V (green) -->
    <g>
      <rect x="180" y="90" width="40" height="40" fill="#bfdbfe" stroke="#1e40af"/>
      <rect x="220" y="90" width="40" height="40" fill="#bbf7d0" stroke="#166534"/>
      <rect x="270" y="90" width="40" height="40" fill="#bfdbfe" stroke="#1e40af"/>
      <rect x="310" y="90" width="40" height="40" fill="#bbf7d0" stroke="#166534"/>
      <rect x="360" y="90" width="40" height="40" fill="#bfdbfe" stroke="#1e40af"/>
      <rect x="400" y="90" width="40" height="40" fill="#bbf7d0" stroke="#166534"/>
      <text x="510" y="115" text-anchor="middle" font-size="16" fill="#9ca3af">…</text>
      <rect x="560" y="90" width="40" height="40" fill="#bfdbfe" stroke="#1e40af"/>
      <rect x="600" y="90" width="40" height="40" fill="#bbf7d0" stroke="#166534"/>
    </g>
    <g>
      <rect x="180" y="150" width="40" height="40" fill="#bfdbfe" stroke="#1e40af"/>
      <rect x="220" y="150" width="40" height="40" fill="#bbf7d0" stroke="#166534"/>
      <rect x="270" y="150" width="40" height="40" fill="#bfdbfe" stroke="#1e40af"/>
      <rect x="310" y="150" width="40" height="40" fill="#bbf7d0" stroke="#166534"/>
      <rect x="360" y="150" width="40" height="40" fill="#bfdbfe" stroke="#1e40af"/>
      <rect x="400" y="150" width="40" height="40" fill="#bbf7d0" stroke="#166534"/>
      <text x="510" y="175" text-anchor="middle" font-size="16" fill="#9ca3af">…</text>
      <rect x="560" y="150" width="40" height="40" fill="#bfdbfe" stroke="#1e40af"/>
      <rect x="600" y="150" width="40" height="40" fill="#bbf7d0" stroke="#166534"/>
    </g>
    <text x="390" y="230" text-anchor="middle" font-size="16" fill="#9ca3af">⋮</text>
    <g>
      <rect x="180" y="270" width="40" height="40" fill="#bfdbfe" stroke="#1e40af"/>
      <rect x="220" y="270" width="40" height="40" fill="#bbf7d0" stroke="#166534"/>
      <rect x="270" y="270" width="40" height="40" fill="#bfdbfe" stroke="#1e40af"/>
      <rect x="310" y="270" width="40" height="40" fill="#bbf7d0" stroke="#166534"/>
      <rect x="360" y="270" width="40" height="40" fill="#bfdbfe" stroke="#1e40af"/>
      <rect x="400" y="270" width="40" height="40" fill="#bbf7d0" stroke="#166534"/>
      <text x="510" y="295" text-anchor="middle" font-size="16" fill="#9ca3af">…</text>
      <rect x="560" y="270" width="40" height="40" fill="#bfdbfe" stroke="#1e40af"/>
      <rect x="600" y="270" width="40" height="40" fill="#bbf7d0" stroke="#166534"/>
    </g>
  </g>

  <rect x="180" y="350" width="20" height="20" fill="#bfdbfe" stroke="#1e40af"/>
  <text x="206" y="365" font-size="13" fill="#374151">key vector (kv_heads × head_dim elements)</text>
  <rect x="180" y="380" width="20" height="20" fill="#bbf7d0" stroke="#166534"/>
  <text x="206" y="395" font-size="13" fill="#374151">value vector (kv_heads × head_dim elements)</text>

  <text x="360" y="428" text-anchor="middle" font-size="13" fill="#6b7280">bytes = 2 × layers × kv_heads × head_dim × bytes_per_elem × N</text>
</svg>
